# STACK COMPLETA de staging/MVP em servidor (modo DEMO) — **autocontida, endurecida e baseada em
# imagens imutáveis**. É ESTE o arquivo que o Dockhand (e Dokploy/Coolify) deve usar.
#
# As imagens do backend/frontend são buildadas no GitHub Actions e publicadas no GHCR
# (ver `.github/workflows/images.yml`); a stack apenas as baixa (`pull_policy: always`).
# NUNCA libera operação real: `LIVE_OPERATIONS_ENABLED=false`.
#
# Uso:
#   cp .env.staging.example .env.staging     # segredos + IMAGE refs
#   docker compose --env-file .env.staging up -d
#   GARAGE_CONTAINER=fundraiser-garage ./scripts/s3-init.sh
#
# Build local (sem GHCR): acrescente `-f compose.build.yaml` (ver o próprio arquivo).
#
# Exposição pública: backend/frontend publicados SÓ no loopback do host (127.0.0.1:8080 e
# 127.0.0.1:3000) para um cloudflared EXTERNO alcançá-los. O `cloudflared` embutido é opcional
# (profile `tunnel`) — use-o apenas se você NÃO tiver um túnel no servidor.
#
# Observação: o compose LOCAL de desenvolvimento (MySQL + Mailpit) fica em
# `infrastructure/compose.local.yaml` (o backend/frontend locais rodam via `./mvnw` e `npm`).

name: fundraiser

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4.11}
    pull_policy: always
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fundraiser}
      MYSQL_USER: ${DB_USERNAME:-fundraiser}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD}
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --binlog-format=ROW
      - --log-bin-trust-function-creators=1
    volumes:
      - mysql_data:/var/lib/mysql
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/run/mysqld:rw,noexec,nosuid,size=16m,mode=1777
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=$${MYSQL_PASSWORD} mysql --protocol=TCP -h 127.0.0.1 -u $${MYSQL_USER} -D $${MYSQL_DATABASE} -Nse 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - data
    logging: *logging

  garage:
    image: ${GARAGE_IMAGE:?defina GARAGE_IMAGE com uma referência imutável}
    pull_policy: always
    restart: unless-stopped
    # Nome fixo (útil para debug/`s3-init.sh` local).
    container_name: fundraiser-garage
    # Single-node: com as envs abaixo, o Garage cria layout, chave S3 e bucket automaticamente
    # (config embutida na imagem — não depende de arquivo no host).
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${APP_STORAGE_S3_ACCESS_KEY:?defina APP_STORAGE_S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${APP_STORAGE_S3_SECRET_KEY:?defina APP_STORAGE_S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${APP_STORAGE_S3_BUCKET:-fundraiser-private}
    volumes:
      - garage_data:/var/lib/garage
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    networks:
      - data
    logging: *logging

  fundraiser-backend:
    image: ${BACKEND_IMAGE:?defina BACKEND_IMAGE com uma referência imutável}
    pull_policy: always
    restart: unless-stopped
    # Nome DNS estável na rede `edge` (alvo do túnel: http://fundraiser-backend:8080).
    container_name: fundraiser-backend
    # Endereço no host onde o túnel EXTERNO alcança o backend (defina BACKEND_BIND_IP no .env.staging).
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-fundraiser}
      DB_USERNAME: ${DB_USERNAME:-fundraiser}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      APP_STORAGE_PROVIDER: s3
      APP_STORAGE_S3_ENDPOINT: http://garage:3900
      APP_STORAGE_S3_ACCESS_KEY: ${APP_STORAGE_S3_ACCESS_KEY:?defina APP_STORAGE_S3_ACCESS_KEY}
      APP_STORAGE_S3_SECRET_KEY: ${APP_STORAGE_S3_SECRET_KEY:?defina APP_STORAGE_S3_SECRET_KEY}
      APP_STORAGE_S3_REGION: garage
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-fundraiser-private}
      SURPRISE_ENCRYPTION_KEY: ${SURPRISE_ENCRYPTION_KEY:?defina SURPRISE_ENCRYPTION_KEY}
      APP_CPF_ENCRYPTION_KEY: ${APP_CPF_ENCRYPTION_KEY:?defina APP_CPF_ENCRYPTION_KEY}
      APP_CPF_HMAC_KEY: ${APP_CPF_HMAC_KEY:?defina APP_CPF_HMAC_KEY}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 2
    pids_limit: 256
    networks:
      - data
      - edge
    logging: *logging

  fundraiser-frontend:
    image: ${FRONTEND_IMAGE:?defina FRONTEND_IMAGE com uma referência imutável}
    pull_policy: always
    restart: unless-stopped
    # Nome DNS estável na rede `edge` (alvo do túnel: http://fundraiser-frontend:3000).
    container_name: fundraiser-frontend
    # Endereço no host onde o túnel EXTERNO alcança o frontend (defina FRONTEND_BIND_IP no .env.staging).
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      fundraiser-backend:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    networks:
      - edge
    logging: *logging

  cloudflared:
    # OPCIONAL: só sobe com `--profile tunnel`. Se já existe um cloudflared no servidor (para outros
    # serviços), NÃO habilite este profile — aponte o túnel externo para 127.0.0.1:8080 / :3000.
    profiles: ["tunnel"]
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.7}
    pull_policy: always
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - fundraiser-frontend
      - fundraiser-backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    networks:
      - edge
    logging: *logging

volumes:
  mysql_data:
  garage_data:

networks:
  edge:
  data:
