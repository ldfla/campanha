services:
  mysql:
    image: mysql:8.4
    container_name: fundraiser-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: fundraiser
      MYSQL_USER: fundraiser
      MYSQL_PASSWORD: fundraiser_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00

  # NOTA: o object storage MinIO não faz parte da stack base do MVP. As imagens
  # públicas `minio/minio` deixaram de existir no registro (Docker Hub/Bitnami/Quay),
  # então o armazenamento privado de documentos roda em memória por padrão
  # (`APP_STORAGE_PROVIDER=memory`). Para habilitar MinIO (ou espelho privado),
  # use `infrastructure/compose.minio.yaml` com `APP_STORAGE_PROVIDER=minio`.

  mailpit:
    image: axllent/mailpit:latest
    container_name: fundraiser-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
