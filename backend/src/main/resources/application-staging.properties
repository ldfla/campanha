# Perfil `staging`: MVP em servidor (DEMO). NUNCA libera operação real.
# Atrás de proxy TLS (Cloudflare Tunnel) — ciente de X-Forwarded-* confiáveis.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
# Cookie de sessão e CSRF no domínio pai quando a API está num subdomínio do site
# (ex.: API em api.meleva.la, site em app.meleva.la). Vazio = host-only (padrão seguro).
server.servlet.session.cookie.domain=${COOKIE_DOMAIN:}
app.security.cookie-domain=${COOKIE_DOMAIN:}

# Plataforma permanece em demonstração: sem cobrança real, sem comunicação externa.
app.live-operations-enabled=false
app.default-campaign-mode=DEMO

# Log menos verboso que o perfil local.
logging.level.la.meleva.fundraiser=INFO
